# /cv/ ---------------------------------------------------------------------------------------------------------
bio:
  - Adam Coscia is a Tenure-Track Assistant Professor in the School of Computing at Stevens Institute of Technology, where he directs the Stevens Visualization Lab. His research helps people make sense of complex data through the design of interactive systems for data visualization and analysis. He has designed and deployed his tools for intelligence analysis, robotics, healthcare, and education, in collaboration with engineers, analysts, educators, and scientists at the NSF AI ALOE Institute, NSA, MIT Lincoln Lab, NASA JPL, Adobe Research, the NC State Laboratory for Analytic Sciences, and the Monterey Bay Aquarium Research Institute. His work appears at premier HCI and visualization venues, including ACM CHI, UIST, IUI, and IEEE VIS and TVCG, and has received a best paper award and three best poster awards. He was also a finalist for the Foley Scholars Award and a recipient of Georgia Tech's President's Fellowship. He received his Ph.D. in Human-Centered Computing from the Georgia Institute of Technology and holds a B.S. in Physics from Stevens.

