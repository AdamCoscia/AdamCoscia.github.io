<!DOCTYPE html>
<html>
  <head>
    <title id="title">Projections &mdash; Adam Coscia</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Adam Coscia" />
    <meta name="description" content="Small games and interactive demos by Adam Coscia." />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/fun/fun.css" />
    <style>
      /* TOP-LEVEL */
      .flex-row {
        font-family: "Quicksand";
        padding: 2rem;
      }

      /* INSTRUCTIONS */
      .instructions-container {
        padding: 0 1rem;
        flex: 1;
        min-width: 225px;
      }
      .title {
        font-family: "Press Start 2P", cursive;
      }
      #projectionSelector {
        font: inherit;
      }

      /* GAME CONTAINER */
      .game-container {
        padding: 0 1rem;
        flex: 2;
        min-width: 200px;
      }
      #board {
        margin: auto;
        display: block;
      }
    </style>
  </head>

  <body style="touch-action: manipulation">
    <div class="flex-row text-center">
      <!-- INSTRUCTIONS -->
      <div class="instructions-container">
        <!-- HEADER -->
        <header class="title">
          <h1>Projections</h1>
        </header>

        <!-- INFO -->
        <div class="info">
          <p>Set the projection style.</p>
        </div>

        <!-- SELECTOR -->
        <select id="projectionSelector">
          <option value="PixelBimetric">Pixel Bimetric</option>
          <option value="PixelTrimetric">Pixel Trimetric</option>
          <option value="Isometric">Isometric</option>
          <option value="Bimetric">Bimetric</option>
          <option value="Trimetric">Trimetric</option>
          <option value="Military">Military</option>
          <option value="Cavalier">Cavalier</option>
          <option value="TopDown">Top Down</option>
        </select>
      </div>

      <!-- GAME -->
      <div class="game-container">
        <canvas id="board"></canvas>
      </div>
    </div>

    <script type="text/javascript" src="/fun/vendor/jquery-3.6.0.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
